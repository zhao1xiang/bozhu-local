<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院注射管理强化版看板</title>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 字体：DM Sans（标题）+ JetBrains Mono（数字）-->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* ─── CSS 变量 ─── */
        :root {
            --purple-deep: #5e19a6;
            --purple-main: #7b2cbf;
            --purple-light: #9d4edd;
            --purple-soft: #e0aaff;
            --bg-purple: #f8f4ff;
            --navy: var(--bg-purple);
            --navy-mid: #f3e8ff;
            --navy-card: rgba(255, 255, 255, 0.94);
            --electric: var(--purple-main);
            --electric2: var(--purple-light);
            --green: #2d9e6b; /* 保持功能性颜色，但可微调 */
            --orange: #e07b2a;
            --red: #d94f35;
            --text-1: #2d1b4d;
            --text-2: #5c4d7d;
            --text-3: #8e7fb0;
            --border: rgba(123, 44, 191, 0.15);
            --glow: rgba(123, 44, 191, 0.12);
            --r: 12px;
            --font-h: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* ─── 重置 ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #fdfbff;
            color: var(--text-1);
            font-family: var(--font-h);
        }

        /* ─── 背景网格纹理 ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 10%, rgba(123, 44, 191, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(157, 78, 221, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(123, 44, 191, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(123, 44, 191, 0.04) 1px, transparent 1px);
            background-size: auto, auto, 40px 40px, 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ─── 外层包裹（确保一屏内 flex 布局）─── */
        .layout {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px 14px;
            gap: 8px;
        }

        /* ══════════════════════════════
           顶部导航 Header
        ══════════════════════════════ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            height: 44px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-2);
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .menu-btn:hover {
            color: var(--electric);
            border-color: var(--electric);
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--text-1) 30%, var(--purple-main));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 时间选择器 */
        .time-selector {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
        }

        .time-btn {
            padding: 5px 11px;
            font-family: var(--font-h);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .time-btn.active {
            background: var(--electric);
            color: #fff;
        }

        .time-btn:hover:not(.active) {
            color: var(--electric);
        }

        .time-divider {
            width: 1px;
            height: 18px;
            background: var(--border);
        }

        /* 自定义月份范围 */
        .custom-range {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px;
            font-size: 12px;
            color: var(--text-2);
        }

        .custom-range select {
            background: transparent;
            border: none;
            color: var(--electric);
            font-family: var(--font-h);
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .custom-range select option {
            background: #ffffff;
            color: var(--text-1);
        }

        /* 通知 & 头像 */
        .notif-btn {
            position: relative;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-2);
            cursor: pointer;
            font-size: 13px;
            transition: color 0.2s, border-color 0.2s;
        }

        .notif-btn:hover {
            color: var(--electric);
            border-color: var(--electric);
        }

        .notif-dot {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 7px;
            height: 7px;
            background: var(--red);
            border-radius: 50%;
            border: 1px solid var(--navy);
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
        }

        /* ══════════════════════════════
           KPI 指标行
        ══════════════════════════════ */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .kpi-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: var(--r);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.3s, box-shadow 0.3s;
            animation: fadeInUp 0.5s ease both;
        }

        .kpi-card:hover {
            border-color: var(--electric);
            box-shadow: 0 4px 16px rgba(0, 119, 182, 0.12);
        }

        .kpi-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .kpi-text .lbl {
            font-size: 10px;
            color: var(--text-2);
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .kpi-text .val {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            color: var(--text-1);
        }

        /* ══════════════════════════════
           中间行：约针率 + 医生绩效
        ══════════════════════════════ */
        .mid-row {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: var(--r);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeInUp 0.6s ease both;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 12px;
            background: var(--electric);
            border-radius: 2px;
        }

        /* 圆环图行 */
        .donut-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            min-height: 0;
        }

        .donut-item {
            text-align: center;
        }

        .donut-chart {
            width: 120px;
            height: 120px;
        }

        .donut-label {
            font-size: 11px;
            color: var(--text-2);
            margin-top: 4px;
        }

        /* 医生表格 */
        .doctor-table {
            width: 100%;
            border-collapse: collapse;
            flex: 1;
            min-height: 0;
        }

        .doctor-table th {
            font-size: 10px;
            color: var(--text-2);
            text-align: left;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            font-weight: 600;
        }

        .doctor-table td {
            padding: 7px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            vertical-align: middle;
        }

        .doc-info {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .doc-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            font-weight: 700;
            flex-shrink: 0;
        }

        .pbar-wrap {
            height: 5px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.06);
            margin-top: 3px;
            overflow: hidden;
        }

        .pbar {
            height: 100%;
            border-radius: 3px;
            transition: width 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .pct {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
        }

        /* ══════════════════════════════
           底部行：趋势 + 眼别 + 病种
        ══════════════════════════════ */
        .bot-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .chart-fill {
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* ─── 动画 ─── */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .kpi-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .kpi-card:nth-child(2) {
            animation-delay: 0.10s;
        }

        .kpi-card:nth-child(3) {
            animation-delay: 0.15s;
        }

        .kpi-card:nth-child(4) {
            animation-delay: 0.20s;
        }

        .kpi-card:nth-child(5) {
            animation-delay: 0.25s;
        }

        .kpi-card:nth-child(6) {
            animation-delay: 0.30s;
        }

        .mid-row .glass-card:nth-child(1) {
            animation-delay: 0.35s;
        }

        .mid-row .glass-card:nth-child(2) {
            animation-delay: 0.40s;
        }

        .bot-row .glass-card:nth-child(1) {
            animation-delay: 0.45s;
        }

        .bot-row .glass-card:nth-child(2) {
            animation-delay: 0.50s;
        }

        .bot-row .glass-card:nth-child(3) {
            animation-delay: 0.55s;
        }
    </style>
</head>

<body>
    <div class="layout">

        <!-- ══ Header ══ -->
        <header class="header">
            <div class="header-left">
                <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
                <h1 class="header-title">医院注射管理强化版看板</h1>
            </div>
            <div class="header-right">
                <!-- 时间选择器 -->
                <div class="time-selector">
                    <button class="time-btn" onclick="setTime(this,'month')">本月</button>
                    <div class="time-divider"></div>
                    <button class="time-btn" onclick="setTime(this,'q3')">近三月</button>
                    <div class="time-divider"></div>
                    <button class="time-btn active" onclick="setTime(this,'half')">近半年</button>
                    <div class="time-divider"></div>
                    <button class="time-btn" onclick="setTime(this,'year')">全年</button>
                    <div class="time-divider"></div>
                    <!-- 自定义范围 -->
                    <div class="custom-range">
                        <select id="start-month" onchange="setCustomTime()">
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6" selected>6月</option>
                            <option value="7">7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>
                        </select>
                        <span style="color:var(--text-3)">–</span>
                        <select id="end-month" onchange="setCustomTime()">
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6">6月</option>
                            <option value="7">7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12" selected>12月</option>
                        </select>
                    </div>
                </div>
                <div class="notif-btn"><i class="fa-regular fa-bell"></i><span class="notif-dot"></span></div>
                <div class="avatar"><i class="fa-solid fa-user" style="font-size:12px;"></i></div>
            </div>
        </header>

        <!-- ══ KPI 行 ══ -->
        <div class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(123, 44, 191, 0.1);">
                    <i class="fa-solid fa-users" style="color:var(--purple-main);"></i>
                </div>
                <div class="kpi-text">
                    <div class="lbl">累计患者数</div>
                    <div class="val" data-target="65">0</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(123, 44, 191, 0.1);">
                    <i class="fa-solid fa-syringe" style="color:var(--purple-main);"></i>
                </div>
                <div class="kpi-text">
                    <div class="lbl">累计完成注药</div>
                    <div class="val" data-target="428">0</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(157, 78, 221, 0.1);">
                    <i class="fa-solid fa-calendar-check" style="color:var(--purple-light);"></i>
                </div>
                <div class="kpi-text">
                    <div class="lbl">今日预约</div>
                    <div class="val" data-target="2">0</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(217, 79, 53, 0.1);">
                    <i class="fa-solid fa-bell" style="color:var(--red);"></i>
                </div>
                <div class="kpi-text">
                    <div class="lbl">复诊提醒</div>
                    <div class="val" data-target="0">0</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(123, 44, 191, 0.1);">
                    <i class="fa-solid fa-chart-line" style="color:var(--purple-main);"></i>
                </div>
                <div class="kpi-text">
                    <div class="lbl">本院强化期约针率</div>
                    <div class="val" data-target="86" data-suffix="%">0</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(199, 125, 255, 0.15);">
                    <i class="fa-solid fa-shield-halved" style="color:var(--purple-soft);"></i>
                </div>
                <div class="kpi-text">
                    <div class="lbl">本院巩固期约针率</div>
                    <div class="val" data-target="84" data-suffix="%">0</div>
                </div>
            </div>
        </div>

        <!-- ══ 中间行 ══ -->
        <div class="mid-row">
            <!-- 医院整体约针率 -->
            <div class="glass-card">
                <div class="card-title">医院整体DOT</div>
                <div class="donut-row">
                    <div class="donut-item">
                        <div id="chart-four" class="donut-chart"></div>
                        <div class="donut-label">四针率</div>
                    </div>
                    <div class="donut-item">
                        <div id="chart-five" class="donut-chart"></div>
                        <div class="donut-label">五针率</div>
                    </div>
                    <div class="donut-item">
                        <div id="chart-six" class="donut-chart"></div>
                        <div class="donut-label">六针率</div>
                    </div>
                </div>
            </div>

            <!-- 医生绩效 -->
            <div class="glass-card">
                <div class="card-title">医生约针率排行</div>
                <table class="doctor-table">
                    <thead>
                        <tr>
                            <th style="width:32%">医生</th>
                            <th style="width:34%">强化期</th>
                            <th style="width:34%">巩固期</th>
                        </tr>
                    </thead>
                    <tbody id="doctor-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- ══ 底部行 ══ -->
        <div class="bot-row">
            <!-- 注射量趋势 -->
            <div class="glass-card">
                <div class="card-title">注射量趋势（月度）</div>
                <div id="trend-chart" class="chart-fill"></div>
            </div>

            <!-- 眼别分布 -->
            <div class="glass-card">
                <div class="card-title">眼别分布</div>
                <div id="eye-chart" class="chart-fill"></div>
            </div>

            <!-- 病种分布 -->
            <div class="glass-card">
                <div class="card-title">病种分布</div>
                <div id="disease-chart" class="chart-fill"></div>
            </div>
        </div>

    </div>

    <script>
        /* ─── 数据映射（不同时间段）─── */
        const DATA = {
            month: { trend: [55], labels: ['本月'], four: 88, five: 80, six: 30 },
            q3: { trend: [40, 50, 55], labels: ['10月', '11月', '12月'], four: 86, five: 77, six: 30 },
            half: { trend: [30, 60, 45, 65, 55, 75], labels: ['7月', '8月', '9月', '10月', '11月', '12月'], four: 85, five: 78, six: 30 },
            year: { trend: [20, 35, 40, 30, 50, 55, 65, 60, 45, 65, 55, 75], labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], four: 84, five: 76, six: 30 }
        };

        let currentRange = 'half';

        /* ─── 时间按钮切换 ─── */
        function setTime(btn, range) {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRange = range;
            refreshCharts(range);
        }

        function setCustomTime() {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            const s = parseInt(document.getElementById('start-month').value);
            const e = parseInt(document.getElementById('end-month').value);
            const months = [];
            const labels = [];
            /* 生成虚假数据 */
            for (let m = s; m <= e; m++) {
                labels.push(m + '月');
                months.push(Math.floor(Math.random() * 40 + 35));
            }
            trendChart.setOption({ xAxis: { data: labels }, series: [{ data: months }] });
        }

        /* ─── CountUp 动画 ─── */
        function countUp(el, target, suffix = '', duration = 900) {
            const start = Date.now();
            const tick = () => {
                const elapsed = Date.now() - start;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                el.textContent = Math.round(target * ease) + suffix;
                if (progress < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        /* 初始化 KPI 数字动画 */
        document.querySelectorAll('.kpi-text .val').forEach(el => {
            const target = parseInt(el.dataset.target);
            const suffix = el.dataset.suffix || '';
            setTimeout(() => countUp(el, target, suffix, 1000), 400);
        });

        /* ─── ECharts 颜色变量 ─── */
        const C = {
            purple: '#7b2cbf',
            purpleLight: '#9d4edd',
            purpleSoft: '#c77dff',
            purplePale: '#e0aaff',
            bg: '#f8f4ff',
            text1: '#2d1b4d',
            text2: '#5c4d7d',
            gridLine: 'rgba(123, 44, 191, 0.08)'
        };

        /* ─── 圆环图 ─── */
        function mkDonut(id, value, color) {
            const chart = echarts.init(document.getElementById(id), null, { renderer: 'svg' });
            chart.setOption({
                animation: true,
                series: [{
                    type: 'pie',
                    radius: ['62%', '78%'],
                    silent: true,
                    startAngle: 90,
                    label: {
                        show: true, position: 'center',
                        formatter: value + '%',
                        fontSize: 16, fontWeight: 700,
                        fontFamily: "'JetBrains Mono', monospace",
                        color: C.text1
                    },
                    data: [
                        { value: value, itemStyle: { color: color } },
                        { value: 100 - value, itemStyle: { color: 'rgba(0,0,0,0.06)' } }
                    ]
                }]
            });
            return chart;
        }

        const donutFour = mkDonut('chart-four', 85, C.purple);
        const donutFive = mkDonut('chart-five', 78, C.purpleLight);
        const donutSix = mkDonut('chart-six', 30, C.purpleSoft);

        /* ─── 医生表格 ─── */
        const doctors = [
            { name: 'Dr. 李', qiang: 90, gong: 88, color: C.purple },
            { name: 'Dr. 张', qiang: 85, gong: 82, color: '#6a0dad' },
            { name: 'Dr. 王', qiang: 88, gong: 90, color: C.purpleLight },
            { name: 'Dr. 陈', qiang: 82, gong: 85, color: C.purpleSoft }
        ];
        const avatarColors = [C.purple, '#6a0dad', C.purpleLight, C.purpleSoft];

        const tbody = document.getElementById('doctor-tbody');
        doctors.forEach((d, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
        <td>
            <div class="doc-info">
                <div class="doc-avatar" style="background:${avatarColors[i]};">${d.name.slice(-1)}</div>
                <span style="font-size:12px;">${d.name}</span>
            </div>
        </td>
        <td>
            <div class="pct" style="color:${avatarColors[i]};">${d.qiang}%</div>
            <div class="pbar-wrap">
                <div class="pbar" style="width:0%; background:linear-gradient(90deg,${avatarColors[i]},rgba(255,255,255,0.3));" data-w="${d.qiang}"></div>
            </div>
        </td>
        <td>
            <div class="pct" style="color:${avatarColors[i]};">${d.gong}%</div>
            <div class="pbar-wrap">
                <div class="pbar" style="width:0%; background:linear-gradient(90deg,${avatarColors[i]},rgba(255,255,255,0.3));" data-w="${d.gong}"></div>
            </div>
        </td>
    `;
            tbody.appendChild(tr);
        });

        /* 进度条延迟动画 */
        setTimeout(() => {
            document.querySelectorAll('.pbar').forEach(b => {
                b.style.width = b.dataset.w + '%';
            });
        }, 600);

        /* ─── 趋势图 ─── */
        const trendChart = echarts.init(document.getElementById('trend-chart'), null, { renderer: 'svg' });

        function trendOption(labels, vals) {
            return {
                animation: true,
                grid: { top: 10, left: 30, right: 10, bottom: 22 },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#ffffff',
                    borderColor: C.purple,
                    textStyle: { color: C.text1, fontSize: 12 }
                },
                xAxis: {
                    type: 'category', data: labels,
                    axisLine: { show: false }, axisTick: { show: false },
                    axisLabel: { color: C.text2, fontSize: 10 }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { color: C.text2, fontSize: 10 },
                    splitLine: { lineStyle: { color: C.gridLine } }
                },
                series: [{
                    name: '注射量', type: 'line', smooth: true,
                    symbol: 'circle', symbolSize: 5,
                    label: {
                        show: true,
                        position: 'top',
                        fontSize: 10,
                        color: C.text2,
                        fontFamily: "'JetBrains Mono', monospace"
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(123, 44, 191, 0.2)' },
                            { offset: 1, color: 'rgba(123, 44, 191, 0)' }
                        ])
                    },
                    lineStyle: { color: C.purple, width: 2 },
                    itemStyle: { color: C.purple },
                    data: vals
                }]
            };
        }

        const d0 = DATA.half;
        trendChart.setOption(trendOption(d0.labels, d0.trend));

        /* ─── 眼别分布 ─── */
        const eyeChart = echarts.init(document.getElementById('eye-chart'), null, { renderer: 'svg' });
        eyeChart.setOption({
            animation: true,
            legend: {
                bottom: 0, textStyle: { color: C.text2, fontSize: 10 },
                icon: 'circle', itemWidth: 8, itemHeight: 8
            },
            series: [{
                type: 'pie', radius: ['40%', '62%'],
                center: ['50%', '45%'],
                silent: false,
                label: {
                    show: true,
                    fontSize: 10,
                    color: C.text1,
                    formatter: '{b}\n{d}%'
                },
                labelLine: { length: 8, length2: 6 },
                emphasis: { label: { fontSize: 12, fontWeight: 700 } },
                data: [
                    { value: 65, name: '左眼', itemStyle: { color: C.purple } },
                    { value: 35, name: '右眼', itemStyle: { color: C.purpleLight } }
                ]
            }]
        });

        /* ─── 病种分布 ─── */
        const diseaseChart = echarts.init(document.getElementById('disease-chart'), null, { renderer: 'svg' });
        diseaseChart.setOption({
            animation: true,
            legend: {
                orient: 'vertical', right: 0, top: 'middle',
                textStyle: { color: C.text2, fontSize: 10 },
                icon: 'circle', itemWidth: 8, itemHeight: 8
            },
            series: [{
                type: 'pie', radius: ['30%', '55%'],
                center: ['36%', '50%'],
                label: {
                    show: true,
                    fontSize: 9,
                    color: C.text1,
                    formatter: '{b} {d}%'
                },
                labelLine: { length: 6, length2: 4 },
                data: [
                    { value: 40, name: 'DME', itemStyle: { color: C.purple } },
                    { value: 30, name: 'AMD', itemStyle: { color: C.purpleLight } },
                    { value: 15, name: 'PCV', itemStyle: { color: C.purpleSoft } },
                    { value: 10, name: 'RVO', itemStyle: { color: C.purplePale } },
                    { value: 5, name: 'etc.', itemStyle: { color: '#dcd0ff' } }
                ]
            }]
        });

        /* ─── 刷新全部图表（切换时间段）─── */
        function refreshCharts(range) {
            const d = DATA[range] || DATA.half;
            trendChart.setOption({ xAxis: { data: d.labels }, series: [{ data: d.trend }] });
            donutFour.setOption({ series: [{ data: [{ value: d.four }, { value: 100 - d.four }], label: { formatter: d.four + '%' } }] });
            donutFive.setOption({ series: [{ data: [{ value: d.five }, { value: 100 - d.five }], label: { formatter: d.five + '%' } }] });
            donutSix.setOption({ series: [{ data: [{ value: d.six }, { value: 100 - d.six }], label: { formatter: d.six + '%' } }] });
        }

        /* ─── 窗口 Resize ─── */
        window.addEventListener('resize', () => {
            trendChart.resize(); eyeChart.resize(); diseaseChart.resize();
            donutFour.resize(); donutFive.resize(); donutSix.resize();
        });
    </script>
</body>

</html>
